<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="JBMLL">
  <!-- El logo completo (public/logo.svg) no sobrevive a 16 px: el marco se corta
       y «JB» se empasta, medido en el navegador. Acá queda su gesto esencial, el
       prompt: la escalera del chevron y el cursor. Dibujado sobre una rejilla de
       16 unidades para que cada bloque caiga en un píxel entero. -->
  <rect width="16" height="16" rx="2" fill="#06080F"/>
  <path fill="#B7CC85" d="M3 3h2v2H3zM5 5h2v2H5zM7 7h2v2H7zM5 9h2v2H5zM3 11h2v2H3z"/>
  <rect x="10" y="10" width="3" height="3" fill="#E0C15A"/>
</svg>
