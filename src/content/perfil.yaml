# El perfil: único y no listado, así que una sola entrada («perfil») basta.
# Lo edita un CMS basado en Git (Sveltia, en una PR futura); los cálculos que
# sí son código — el teléfono legible, los enlaces de contacto — viven en
# src/data/perfil.ts y no aquí.
perfil:
  nombre: Josue Bladimir Morales Llanganate
  marca: JBMLL
  titular: Software Engineer, IA aplicada a salud
  ubicacion: Salcedo, Cotopaxi, Ecuador
  disponibilidad: Disponible para remoto

  # Para el CV (PDF): el párrafo de «Perfil profesional».
  resumen: >-
    Ingeniero de Software backend especializado en Java y Spring Boot, con
    experiencia construyendo sistemas escalables, APIs REST y módulos
    potenciados con IA sobre PostgreSQL y servicios en la nube. Integro LLMs en
    backends de producción con Spring AI y trabajo con un flujo guiado por
    especificaciones (SDD) y pruebas (TDD) con enfoque human-in-the-loop.
    También entrego productos full-stack de extremo a extremo, desde la
    arquitectura y el CI/CD hasta el despliegue con contenedores. Cómodo con
    equipos remotos, code reviews y documentación técnica clara.
  idiomas:
    - idioma: Español
      nivel: Nativo
    - idioma: Inglés
      nivel: Intermedio (B1)

  correo: juniorbmorales@gmail.com

  # En formato E.164 y sin separadores: es lo que espera wa.me y lo que evita
  # que el enlace y el número visible se separen. El formato legible se
  # calcula desde este mismo valor en src/data/perfil.ts, no se escribe aparte.
  telefono: '+593958774749'

  github: MrT-coder
  linkedin: josue-bladimir-morales-llanganate-20086636b
  orcid: 0009-0004-2687-2314

  # Opcional: sin ella, el bloque de arranque de la portada cae al banner
  # ASCII (ver Terminal.astro). `src` vive bajo /media/, que es el único
  # `public_folder` que declara public/admin/config.yml para el CMS.
  foto:
    src: /media/FOTO_INGE_PUNK.jpg
    alt: 'Retrato ilustrado estilo cyberpunk de un hombre joven de cabello oscuro peinado hacia un costado, con traje oscuro y corbata verde azulada, bajo luces de neón rosadas y azules, sobre un fondo de ciudad nocturna con letreros verticales luminosos.'

  # Enlace de distribuidor (afiliado), no un medio de contacto: por eso vive
  # aparte y no junto a correo/teléfono/github/linkedin/orcid de arriba. Ver
  # `distribuidor` en src/content.config.ts. Opcional: en blanco, ni
  # /contacto ni /sobre-mi muestran nada. `divulgacion` es una marca corta
  # (máximo 24 caracteres) que se dibuja junto al enlace; es obligatoria si
  # hay URL.
  distribuidor:
    etiqueta: firmas electrónicas
    href: https://ezsignec.com/r/8wxxqx9rbd
    divulgacion: afiliado
